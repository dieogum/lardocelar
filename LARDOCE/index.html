<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" href="icone.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF7F0" id="theme-meta">
<title>Lar & Vida</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAF7F0;--surf:#FFF;--brd:#EAE2D4;--brds:#F3EDE2;
  --pri:#C14B2A;--pris:#FAE9E4;
  --grn:#4A865A;--grns:#E2F0E6;
  --amb:#C5820A;--ambs:#FBF2D8;
  --txt:#1C1208;--txm:#6B5A48;--txl:#A09080;
  --shd:0 1px 8px rgba(0,0,0,.07);
}
body.dark{
  --bg:#131110;--surf:#1E1A17;--brd:#332C26;--brds:#29231D;
  --txt:#F2EDE4;--txm:#BBA888;--txl:#7A6858;
  --shd:0 1px 8px rgba(0,0,0,.3);
}
body{background:var(--bg);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .2s}
#app-wrap{max-width:480px;margin:0 auto}
input,button,textarea,select{font-family:inherit}
button{cursor:pointer}

/* ── PIN ── */
#pin-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
#pin-box{text-align:center;width:100%}
#pin-box .logo{font-size:52px;margin-bottom:12px}
#pin-box h1{font-size:26px;font-weight:700;color:var(--txt);margin-bottom:6px}
#pin-box p{font-size:13px;color:var(--txl);margin-bottom:28px}
#pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brd);background:var(--brds);transition:background .15s}
.dot.filled{background:var(--pri);border-color:var(--pri)}
#pin-err{font-size:12px;color:var(--pri);min-height:18px;margin-bottom:8px}
#keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto}
.kbtn{background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:16px;font-size:22px;font-weight:600;color:var(--txt);transition:background .1s}
.kbtn:active{background:var(--brds)}
.kbtn.del{font-size:18px;color:var(--txm)}

/* ── APP ── */
#app{display:none;padding-bottom:76px}
header{background:var(--surf);border-bottom:1px solid var(--brd);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.h-title{font-size:20px;font-weight:700;color:var(--txt);letter-spacing:-.3px}
.h-sub{font-size:11px;color:var(--txl)}
.h-right{display:flex;align-items:center;gap:6px}
.badge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500}
.badge-r{background:var(--pris);color:var(--pri)}
.badge-g{background:var(--grns);color:var(--grn)}
#sync-btn{background:none;border:none;font-size:17px;color:var(--txl);padding:4px;line-height:1}
#content{padding:14px 14px 0}
nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--brd);display:flex;padding-bottom:4px;z-index:40}
.nb{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:10px;color:var(--txl);font-weight:400;transition:color .1s}
.nb.on{color:var(--pri);font-weight:600}
.nb-ico{font-size:20px;line-height:1}
.nb-bar{width:18px;height:2px;background:var(--pri);border-radius:1px}

/* ── SHEET MODAL ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none}
#sheet{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;background:var(--surf);border-radius:20px 20px 0 0;padding:20px 18px 48px;max-height:90vh;overflow-y:auto;overflow-x:hidden;z-index:90;display:none}
.sheet-drag{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:18px;font-weight:700;color:var(--txt);margin-bottom:16px}

/* ── CARDS ── */
.card{background:var(--surf);border-radius:16px;box-shadow:var(--shd);border:1px solid var(--brd)}
.c-pad{padding:16px}
.row{display:flex;align-items:center;justify-content:space-between}
.mb8{margin-bottom:8px}
.mb12{margin-bottom:12px}
.mb14{margin-bottom:14px}

/* ── FORM ── */
.f-label{font-size:12px;color:var(--txm);font-weight:500;margin-bottom:4px}
.f-inp{width:100%;border:1px solid var(--brd);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--txt);background:var(--bg);outline:none;transition:border-color .15s}
.f-inp:focus{border-color:var(--pri)}
textarea.f-inp{resize:vertical;min-height:90px}
.f-group{margin-bottom:12px}

/* ── BUTTONS ── */
.btn{border:none;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;font-family:inherit}
.btn:active{opacity:.8}
.btn-pri{background:var(--pri);color:#FFF}
.btn-sec{background:transparent;border:1.5px solid var(--pri);color:var(--pri)}
.btn-grn{background:var(--grn);color:#FFF}
.btn-amb{background:var(--amb);color:#FFF}
.btn-ghost{background:var(--brds);color:var(--txm);border:none}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-full{width:100%}
.btn-row{display:flex;gap:8px;margin-bottom:14px}

/* ── PROGRESS BAR ── */
.prog-wrap{background:var(--brds);border-radius:6px;height:8px;overflow:hidden}
.prog-bar{height:100%;border-radius:6px;transition:width .5s}

/* ── CAT GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-btn{background:var(--bg);border:1.5px solid var(--brd);border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;transition:border-color .1s}
.cat-btn.on{border-color:currentColor}
.cat-ico{font-size:18px}
.cat-lbl{font-size:10px;color:var(--txl);font-weight:500;margin-top:2px}

/* ── USER PICK ── */
.up-row{display:flex;gap:8px;margin-bottom:14px}
.up-btn{flex:1;border:1.5px solid var(--brd);border-radius:10px;padding:9px 4px;cursor:pointer;font-weight:600;font-size:12px;color:var(--txm);background:var(--bg);transition:all .1s;font-family:inherit}
.up-btn.on-r{background:var(--pris);border-color:var(--pri);color:var(--pri)}
.up-btn.on-g{background:var(--grns);border-color:var(--grn);color:var(--grn)}
.up-btn.on-a{background:var(--ambs);border-color:var(--amb);color:var(--amb)}

/* ── ITEMS ── */
.item-row{padding:10px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.item-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.item-name{font-size:13px;font-weight:500;color:var(--txt)}
.item-sub{font-size:11px;color:var(--txl)}
.x-btn{background:none;border:none;cursor:pointer;color:var(--txl);font-size:20px;line-height:1;padding:0 3px}
.edit-btn{background:none;border:none;cursor:pointer;color:var(--txl);font-size:15px;line-height:1;padding:0 3px}
.check-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--brd);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check-box.done{border:none;background:var(--grn);color:#FFF;font-size:12px}

/* ── DONUT CHART ── */
#chart-wrap{display:flex;align-items:center;gap:16px;margin-bottom:8px}
#donut{flex-shrink:0}
#chart-legend{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.leg-row{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txm)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── CALENDAR ── */
.week-grid{display:flex;gap:4px}
.day-btn{flex:1;padding:8px 2px;border-radius:10px;cursor:pointer;text-align:center;background:var(--bg);border:1.5px solid var(--brd);font-family:inherit;transition:background .1s}
.day-btn.today{background:var(--pri);border-color:var(--pri)}
.day-name{font-size:10px;color:var(--txl);margin-bottom:2px}
.day-num{font-size:14px;font-weight:700;color:var(--txt)}
.day-btn.today .day-name,.day-btn.today .day-num{color:#FFF}
.day-dot{width:4px;height:4px;border-radius:2px;background:var(--amb);margin:2px auto 0}
.day-btn.today .day-dot{background:#FFF9}
.ev-card{padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.ev-line{width:3px;border-radius:1.5px;align-self:stretch;flex-shrink:0;margin-right:10px}

/* ── SHOPPING ── */
#shop-summary{display:flex;gap:12px;margin-bottom:12px}
.sum-col{flex:1;text-align:center}
.sum-val{font-size:17px;font-weight:700}
.sum-lbl{font-size:11px;color:var(--txl)}
.warn-box{margin-top:10px;background:#FEE8E3;border-radius:8px;padding:7px 12px;font-size:12px;color:var(--pri)}
.shop-done-hdr{font-size:11px;color:var(--txl);margin:10px 0 7px}

/* ── NOTES ── */
#notes-grid{columns:2;gap:10px}
.note-card{border-radius:14px;padding:13px;margin-bottom:10px;break-inside:avoid;position:relative;border:1px solid transparent}
.note-xtitle{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:5px;padding-right:20px}
.note-body{font-size:12px;color:var(--txm);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.note-foot{font-size:10px;color:var(--txl);margin-top:8px}
.note-x{position:absolute;top:8px;right:9px;background:none;border:none;cursor:pointer;font-size:18px;line-height:1}

/* ── SETTINGS ── */
.set-section{font-size:11px;font-weight:700;color:var(--txl);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--brds)}
.setting-label{font-size:13px;font-weight:500;color:var(--txt)}
.setting-sub{font-size:11px;color:var(--txl);margin-top:2px}

/* ── SCAN ── */
.scan-drop{background:var(--bg);border:2px dashed var(--brd);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;margin-bottom:14px}
.scan-ico{font-size:36px;margin-bottom:8px}

/* ── EMPTY STATE ── */
.empty{padding:28px;text-align:center}
.empty-ico{font-size:28px;margin-bottom:6px}
.empty-txt{color:var(--txl);font-size:13px}
.empty-sub{color:var(--txl);font-size:12px;margin-top:3px}

/* ── TOAST ── */
#toast{position:fixed;bottom:90px;left:0;right:0;margin:0 auto;width:fit-content;max-width:320px;background:rgba(28,18,8,.88);color:#FFF;padding:9px 18px;border-radius:20px;font-size:13px;display:none;z-index:200;text-align:center}

/* ── WEEK NAV ── */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wn-btn{background:var(--bg);border:1px solid var(--brd);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.wn-lbl{font-size:13px;font-weight:600;color:var(--txt)}
.day-section{margin-bottom:14px}
.day-section-hdr{font-size:11px;font-weight:600;color:var(--txm);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.today-tag{background:var(--pri);color:#FFF;border-radius:4px;padding:1px 6px;font-size:10px}

/* ── NOTE PALETTES ── */
.pal-row{display:flex;gap:8px;margin-bottom:14px}
.pal-btn{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2.5px solid transparent;transition:border-color .1s}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:9px 14px}
.mn-btn{background:none;border:none;font-size:22px;color:var(--txm);cursor:pointer;padding:0 4px;line-height:1}
.mn-lbl{font-size:14px;font-weight:700;color:var(--txt)}

/* ── BALANCE CARD ── */
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.bal-col{padding:10px 14px;text-align:center}
.bal-col:first-child{border-right:1px solid var(--brds)}
.bal-val{font-size:15px;font-weight:700;margin-bottom:2px}
.bal-lbl{font-size:10px;color:var(--txl)}
.bal-divider{height:1px;background:var(--brds);margin:0 14px}
.bal-saldo{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.bal-saldo-lbl{font-size:11px;color:var(--txl)}
.bal-saldo-val{font-size:20px;font-weight:800}

/* ── TOGGLE ── */
.toggle{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:var(--brd);border-radius:26px;cursor:pointer;transition:.2s}
.tslider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#FFF;border-radius:50%;transition:.2s}
input:checked+.tslider{background:var(--grn)}
input:checked+.tslider:before{transform:translateX(18px)}

/* ── RECURRING ── */
.rec-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px}
.rec-badge{font-size:9px;background:var(--ambs);color:var(--amb);border-radius:4px;padding:1px 5px;font-weight:600;margin-left:4px}
.inc-badge{font-size:9px;background:var(--grns);color:var(--grn);border-radius:4px;padding:1px 5px;font-weight:600;margin-left:4px}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--brd);margin:14px 0}
.mb6{margin-bottom:6px}

/* ── HISTÓRICO DE PREÇOS ── */
.price-tag{font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;flex-shrink:0}
.price-up{color:var(--pri);background:var(--pris)}
.price-dn{color:var(--grn);background:var(--grns)}
.price-new{color:var(--amb);background:var(--ambs)}
.ph-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--brds)}
.ph-date{font-size:12px;color:var(--txl);flex-shrink:0;width:72px}
.ph-price{font-size:15px;font-weight:700;color:var(--txt);flex:1;text-align:center}
.ph-delta{font-size:11px;font-weight:700;flex-shrink:0;min-width:52px;text-align:right}
.spark-wrap{flex-shrink:0}

/* ── GRUPO COLAPSÁVEL ── */
.group-hdr{cursor:pointer;transition:opacity .1s}
.group-hdr:active{opacity:.8}
.group-body{padding-left:10px;border-left:3px solid var(--brd);margin-left:6px;margin-bottom:10px}
.group-body .card{border-left:none}
.group-count{font-size:11px;color:var(--txl);font-weight:400;margin-left:4px}
.group-chevron{font-size:13px;color:var(--txl);margin-left:6px;transition:transform .2s}
.group-chevron.open{transform:rotate(180deg)}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div id="pin-box">
    <div class="logo">🏡</div>
    <h1>Lar & Vida</h1>
    <p>Digite o PIN de acesso</p>
    <div id="pin-dots">
      <div class="dot" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
    <div id="pin-err"></div>
    <div id="keypad"></div>
  </div>
</div>

<!-- APP -->
<div id="app-wrap">
  <div id="app">
    <header>
      <div>
        <div class="h-title">Lar & Vida</div>
        <div class="h-sub" id="h-month"></div>
      </div>
      <div class="h-right" id="h-right"></div>
    </header>
    <div id="content"></div>
    <nav id="nav"></nav>
  </div>
</div>

<!-- OVERLAY + SHEET -->
<div id="overlay" onclick="closeSheet()"></div>
<div id="sheet"></div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════
const CATS=[
  {id:'alimentacao',label:'Alimentação',icon:'🛒',color:'#C5820A'},
  {id:'moradia',    label:'Moradia',    icon:'🏠',color:'#3A72A8'},
  {id:'transporte', label:'Transporte', icon:'🚗',color:'#4A865A'},
  {id:'saude',      label:'Saúde',      icon:'💊',color:'#C14B2A'},
  {id:'educacao',   label:'Educação',   icon:'📚',color:'#7060B0'},
  {id:'lazer',      label:'Lazer',      icon:'🎭',color:'#B0508A'},
  {id:'vestuario',  label:'Vestuário',  icon:'👕',color:'#1A9A90'},
  {id:'outros',     label:'Outros',     icon:'📦',color:'#8A8A8A'},
];
const ICATS=[
  {id:'salario',    label:'Salário',    icon:'💼',color:'#4A865A'},
  {id:'freelance',  label:'Freelance',  icon:'💻',color:'#3A72A8'},
  {id:'aluguel_r',  label:'Aluguel',    icon:'🏘',color:'#7060B0'},
  {id:'invest',     label:'Investimento',icon:'📈',color:'#C5820A'},
  {id:'presente',   label:'Presente',   icon:'🎁',color:'#B0508A'},
  {id:'outros_r',   label:'Outros',     icon:'💵',color:'#8A8A8A'},
];
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
              'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DNAMES=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DFULL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const NPALS=[
  {bg:'#FFFBDC',bdr:'#E8D840'},{bg:'#E6F5E8',bdr:'#6AB87A'},
  {bg:'#F0E8F8',bdr:'#B080D8'},{bg:'#E2EEF8',bdr:'#6A9ED0'},
  {bg:'#FDEAE4',bdr:'#D07060'},
];

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const NOW=new Date();
const S={
  tab:'financas', weekOff:0,
  viewMonth:NOW.getMonth(), viewYear:NOW.getFullYear(),
  orc:5000, tx:[], inc:[], rec:[], ev:[], si:[], ph:{}, nt:[],
  unames:['Você','Cônjuge'], pin:'1234',
  syncUrl:'', syncPass:'', claudeKey:'',
  darkMode:false,
};

// ═══════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════
function lsGet(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v))}

function loadAll(){
  S.orc=lsGet('orc',5000); S.tx=lsGet('tx',[]); S.inc=lsGet('inc',[]);
  S.rec=lsGet('rec',[]); S.ev=lsGet('ev',[]);
  S.si=lsGet('si',[]); S.ph=lsGet('ph',{}); S.nt=lsGet('nt',[]);
  S.unames=lsGet('un',['Você','Cônjuge']); S.pin=lsGet('pin','1234');
  S.syncUrl=lsGet('syncUrl',''); S.syncPass=lsGet('syncPass','');
  S.claudeKey=lsGet('claudeKey',''); S.darkMode=lsGet('darkMode',false);
  applyDark();
  applyRecurring();
  migratePh();
}

function persist(key,val){
  lsSet(key,val);
  queueSync(key,val);
}

// ═══════════════════════════════════════════════════
// DARK MODE
// ═══════════════════════════════════════════════════
function applyDark(){
  document.body.classList.toggle('dark',S.darkMode);
  const m=document.getElementById('theme-meta');
  if(m)m.content=S.darkMode?'#131110':'#FAF7F0';
}
function toggleDark(){
  S.darkMode=!S.darkMode;
  lsSet('darkMode',S.darkMode);
  applyDark();
}

// ═══════════════════════════════════════════════════
// SYNC
// ═══════════════════════════════════════════════════
let syncQ={}, syncTimer=null, syncing=false;
const DATA_KEYS=['orc','tx','inc','rec','ev','si','ph','nt','un'];

function queueSync(key,val){
  if(!DATA_KEYS.includes(key))return;
  syncQ[key]={val:JSON.stringify(val),ts:Date.now()};
  clearTimeout(syncTimer);
  syncTimer=setTimeout(flushSync,2500);
}

async function flushSync(){
  if(syncing||!S.syncUrl||!S.syncPass||!navigator.onLine)return;
  const q={...syncQ};
  if(!Object.keys(q).length)return;
  syncing=true; setSyncIcon('⏫');
  try{
    const fd=new URLSearchParams();
    fd.append('p',S.syncPass);fd.append('a','push');fd.append('d',JSON.stringify(q));
    const r=await fetch(S.syncUrl,{method:'POST',body:fd,redirect:'follow'});
    const data=await r.json();
    if(data.ok){syncQ={};setSyncIcon('✓');lsSet('lastSync',Date.now());}
    else setSyncIcon('⚠');
  }catch{setSyncIcon('⚠');}
  syncing=false;
}

async function pullSync(){
  if(!S.syncUrl||!S.syncPass||!navigator.onLine)return;
  setSyncIcon('⏬');
  try{
    const r=await fetch(`${S.syncUrl}?a=pull&p=${encodeURIComponent(S.syncPass)}`,{redirect:'follow'});
    const data=await r.json();
    if(data.ok&&data.d){
      for(const[k,{val,ts}]of Object.entries(data.d)){
        const localTs=lsGet('ts_'+k,0);
        if(ts>localTs){localStorage.setItem(k,val);lsSet('ts_'+k,ts);}
      }
      loadAll(); render(); setSyncIcon('✓'); toast('Dados sincronizados ✓');
    }
  }catch{setSyncIcon('⚠');}
}

function setSyncIcon(ico){
  const el=document.getElementById('sync-btn');
  if(el)el.textContent=ico;
}

// RECURRING EXPENSES
// ═══════════════════════════════════════════════════
function applyRecurring(){
  if(!S.rec.length)return;
  const key=`${NOW.getFullYear()}-${NOW.getMonth()}`;
  const applied=lsGet('recApplied',{});
  const done=applied[key]||[];
  let changed=false;
  S.rec.forEach(r=>{
    if(!done.includes(r.id)){
      const day=Math.min(r.day||1,28);
      const d=new Date(NOW.getFullYear(),NOW.getMonth(),day);
      S.tx.push({id:uid(),amount:r.amount,category:r.category,label:r.label,user:r.user||'u1',date:d.toISOString(),isRec:true,recId:r.id});
      done.push(r.id);
      changed=true;
    }
  });
  if(changed){applied[key]=done;lsSet('recApplied',applied);lsSet('tx',S.tx);}
}

// NOTIFICATIONS
// ═══════════════════════════════════════════════════
async function requestNotifications(){
  if(!('Notification' in window)){toast('Navegador sem suporte a notificações');return false;}
  const p=await Notification.requestPermission();
  const ok=p==='granted';
  lsSet('notifEnabled',ok);
  toast(ok?'Notificações ativadas ✓':'Permissão negada pelo sistema');
  return ok;
}

function checkAndNotify(){
  if(!lsGet('notifEnabled',false))return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const shown=lsGet('notifShown',{});
  const todayShown=shown[TODAY]||[];
  const tmrw=new Date(NOW);tmrw.setDate(tmrw.getDate()+1);
  const tmrwKey=toDS(tmrw);

  S.ev.filter(e=>e.date===TODAY).forEach(ev=>{
    if(!todayShown.includes(ev.id+'_d')){
      new Notification('📅 Hoje: '+ev.title,{body:ev.time?'às '+ev.time:'',icon:'icone.png'});
      todayShown.push(ev.id+'_d');
    }
    // Schedule timed notification for today
    if(ev.time){
      const[h,m]=ev.time.split(':').map(Number);
      const t=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate(),h,m).getTime()-Date.now();
      if(t>0&&t<8*60*60*1000&&!todayShown.includes(ev.id+'_t')){
        setTimeout(()=>{
          new Notification('⏰ '+ev.title,{body:'Agora!',icon:'icone.png'});
          toast('⏰ '+ev.title);
        },t);
        todayShown.push(ev.id+'_t');
      }
    }
  });

  // Tomorrow reminder
  S.ev.filter(e=>e.date===tmrwKey).forEach(ev=>{
    if(!todayShown.includes(ev.id+'_tmr')){
      new Notification('📅 Amanhã: '+ev.title,{body:ev.time?'às '+ev.time:'',icon:'icone.png'});
      todayShown.push(ev.id+'_tmr');
    }
  });

  shown[TODAY]=todayShown;
  lsSet('notifShown',shown);
}

function importBackup(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.version)throw new Error('Arquivo inválido');
      S.orc=d.orc||5000;S.tx=d.tx||[];S.inc=d.inc||[];S.rec=d.rec||[];
      S.ev=d.ev||[];S.si=d.si||[];S.ph=d.ph||{};S.nt=d.nt||[];
      S.unames=d.un||['Você','Cônjuge'];
      lsSet('orc',S.orc);lsSet('tx',S.tx);lsSet('inc',S.inc);lsSet('rec',S.rec);
      lsSet('ev',S.ev);lsSet('si',S.si);lsSet('ph',S.ph);lsSet('nt',S.nt);
      lsSet('un',S.unames);
      closeSheet();render();toast('Backup restaurado ✓');
    }catch(err){toast('Arquivo de backup inválido');}
  };
  reader.readAsText(file);
}

const fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtS=n=>`R$ ${n.toFixed(2).replace('.',',')}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toDS(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const TODAY=toDS(NOW);

function getWeekDays(off=0){
  const b=new Date(NOW);
  b.setDate(b.getDate()-b.getDay()+off*7);
  return Array.from({length:7},(_,i)=>new Date(b.getFullYear(),b.getMonth(),b.getDate()+i));
}
function getEst(name){
  const k=name.toLowerCase().trim();
  if(S.ph[k])return S.ph[k];
  const h=Object.keys(S.ph).find(p=>p.includes(k)||k.includes(p));
  return h?S.ph[h]:null;
}
function monthTx(){
  return S.tx.filter(t=>{const d=new Date(t.date);return d.getMonth()===S.viewMonth&&d.getFullYear()===S.viewYear;});
}
function monthInc(){
  return S.inc.filter(t=>{const d=new Date(t.date);return d.getMonth()===S.viewMonth&&d.getFullYear()===S.viewYear;});
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>el.style.display='none',2200);
}
function isViewingNow(){return S.viewMonth===NOW.getMonth()&&S.viewYear===NOW.getFullYear();}
function prevMonth(){
  if(S.viewMonth===0){S.viewMonth=11;S.viewYear--;}else S.viewMonth--;
  render();
}
function nextMonth(){
  if(S.viewMonth===11){S.viewMonth=0;S.viewYear++;}else S.viewMonth++;

}

let pinInput='';
function buildKeypad(){
  const kp=document.getElementById('keypad');
  const nums=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  kp.innerHTML=nums.map(n=>{
    if(n==='')return`<div></div>`;
    return`<button class="kbtn${n==='⌫'?' del':''}" onclick="pinKey('${n}')">${n}</button>`;
  }).join('');
}
function pinKey(k){
  if(k==='⌫'){pinInput=pinInput.slice(0,-1);}
  else if(pinInput.length<4){pinInput+=k;}
  updateDots();
  if(pinInput.length===4)setTimeout(checkPin,80);
}
function updateDots(){
  for(let i=0;i<4;i++){
    document.getElementById('d'+i).className='dot'+(i<pinInput.length?' filled':'');
  }
}
function checkPin(){
  if(pinInput===S.pin){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('app').style.display='block';
    render();
    setTimeout(checkAndNotify,1000);
    if(S.syncUrl&&S.syncPass)pullSync();
    window.addEventListener('online',()=>{flushSync();pullSync();});
  }else{
    document.getElementById('pin-err').textContent='PIN incorreto. Tente novamente.';
    pinInput='';updateDots();
    setTimeout(()=>document.getElementById('pin-err').textContent='',1500);
  }
}

    html+=`<div class="card c-pad mb12">
      <div style="font-size:12px;font-weight:600;color:var(--txm);margin-bottom:10px">Distribuição de despesas</div>

function drawDonut(cats,total){
  const cv=document.getElementById('donut');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const cx=60,cy=60,R=46,r=28;
  ctx.clearRect(0,0,120,120);
  ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);
  ctx.arc(cx,cy,r,2*Math.PI,0,true);
  ctx.fillStyle=S.darkMode?'#29231D':'#F3EDE2';ctx.fill();
  let ang=-Math.PI/2;
  cats.forEach(c=>{
    const sweep=(c.v/total)*2*Math.PI;
    ctx.beginPath();
    ctx.arc(cx,cy,R,ang,ang+sweep);
    ctx.arc(cx,cy,r,ang+sweep,ang,true);
    ctx.closePath();ctx.fillStyle=c.color;ctx.fill();
    ang+=sweep;
  });
  ctx.fillStyle=S.darkMode?'#F2EDE4':'#1C1208';
  ctx.font='bold 10px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(fmt(total),cx,cy);
}

// Migra formato antigo {name: number} → {name: [{price, date}]}
function migratePh(){
  let changed=false;
  Object.entries(S.ph).forEach(([k,v])=>{
    if(typeof v==='number'){S.ph[k]=[{price:v,date:TODAY}];changed=true;}
  });
  if(changed)lsSet('ph',S.ph);
}

// Retorna último registro de preço para um item (busca fuzzy)
function getLastPh(name){
  if(!name)return null;
  const k=name.toLowerCase().trim();
  let hist=S.ph[k];
  if(!hist){
    const key=Object.keys(S.ph).find(p=>p.includes(k)||k.includes(p));
    if(key)hist=S.ph[key];
  }
  if(!hist||!hist.length)return null;
  if(Array.isArray(hist))return hist[hist.length-1];
  return{price:hist,date:TODAY};
}

// Registra novo preço (só salva se diferente do último)
function recordPh(name,price){
  if(!name||!price||price<=0)return false;
  const k=name.toLowerCase().trim();
  if(!Array.isArray(S.ph[k])){
    S.ph[k]=S.ph[k]?[{price:S.ph[k],date:TODAY}]:[];
  }
  const arr=S.ph[k];
  const last=arr.length?arr[arr.length-1]:null;
  if(!last||last.price!==price){
    arr.push({price,date:TODAY});
    persist('ph',S.ph);
    return true;
  }
  return false;
}

// Calcula variação entre os dois últimos preços
function priceDelta(hist){
  if(!hist||hist.length<2)return null;
  const prev=hist[hist.length-2].price;
  const curr=hist[hist.length-1].price;
  if(!prev)return null;
  const pct=((curr-prev)/prev*100);
  return{pct:Math.abs(pct).toFixed(1),up:curr>prev,eq:curr===prev};
}

// Desenha sparkline SVG
function sparklineSvg(hist){
  if(!hist||hist.length<2)return'';
  const prices=hist.map(h=>h.price);
  const mn=Math.min(...prices),mx2=Math.max(...prices);
  const range=mx2-mn||mn*0.1||1;
  const W=72,H=30,P=3;
  const coords=prices.map((p,i)=>({
    x:P+(i/(prices.length-1))*(W-P*2),
    y:H-P-((p-mn)/range)*(H-P*2)
  }));
  const pts=coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const last=coords[coords.length-1];
  const lastUp=prices[prices.length-1]>=prices[prices.length-2];
  const col=lastUp?'#C14B2A':'#4A865A';
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="spark-wrap">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="${col}"/>
  </svg>`;
}

// Abre modal de histórico de preços de um item
function openPriceHistory(name){
  const k=name.toLowerCase().trim();
  let hist=Array.isArray(S.ph[k])?S.ph[k]:(S.ph[k]?[{price:S.ph[k],date:TODAY}]:null);
  if(!hist||!hist.length){toast('Sem histórico para "'+name+'"');return;}
  const sorted=[...hist].sort((a,b)=>a.date.localeCompare(b.date));
  const first=sorted[0].price;
  const last=sorted[sorted.length-1].price;
  const totalPct=first?((last-first)/first*100).toFixed(1):0;
  const trendCol=last>=first?'var(--pri)':'var(--grn)';
  const spark=sparklineSvg(sorted);

  // Linhas de histórico (mais recente primeiro)
  const rows=[...sorted].reverse().map((h,i,arr)=>{
    const prev=arr[i+1];
    let delta='';
    if(prev){
      const diff=h.price-prev.price;
      const pct=prev.price?(diff/prev.price*100).toFixed(1):0;
      if(diff>0)delta=`<span class="ph-delta price-tag price-up">↑${Math.abs(pct)}%</span>`;
      else if(diff<0)delta=`<span class="ph-delta price-tag price-dn">↓${Math.abs(pct)}%</span>`;
      else delta=`<span class="ph-delta" style="color:var(--txl);font-size:11px">igual</span>`;
    }else{
      delta=`<span class="ph-delta price-tag price-new">1º reg.</span>`;
    }
    const dateF=h.date.replace('T',' ').split(' ')[0].split('-').reverse().join('/');
    return`<div class="ph-row">
      <span class="ph-date">${dateF}</span>
      <span class="ph-price">${fmtS(h.price)}</span>
      ${delta}
    </div>`;
  }).join('');

  sheet(`<div class="sheet-drag"></div>
    <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:16px">
      <div style="flex:1">
        <div style="font-size:20px;font-weight:800;color:var(--txt);margin-bottom:2px">${name}</div>
        <div style="font-size:12px;color:var(--txl)">${sorted.length} registro${sorted.length!==1?'s':''} · toque para editar</div>
      </div>
      ${spark}
    </div>
    <div class="card c-pad mb14">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:11px;color:var(--txl);margin-bottom:2px">Último preço</div>
          <div style="font-size:24px;font-weight:800;color:var(--txt)">${fmtS(last)}</div>
        </div>
        ${sorted.length>1?`<div style="text-align:right">
          <div style="font-size:11px;color:var(--txl);margin-bottom:2px">Variação total</div>
          <div style="font-size:18px;font-weight:700;color:${trendCol}">${last>=first?'+':''}${totalPct}%</div>
          <div style="font-size:10px;color:var(--txl)">${sorted[0].date.split('-').reverse().slice(0,2).join('/')} → hoje</div>
        </div>`:''}
      </div>
    </div>
    <div style="font-size:12px;font-weight:600;color:var(--txm);margin-bottom:4px">Histórico de preços</div>
    ${rows}
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-pri" style="flex:1" onclick="openUpdatePrice(decodeURIComponent('${encodeURIComponent(name)}'))">Registrar novo preço</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">Fechar</button>
    </div>
  `);
}
window.openPriceHistory=openPriceHistory;

function openUpdatePrice(name){

  sheet(`<div class="sheet-drag"></div>

function saveUpdatedPrice(name){
  const price=parseFloat(document.getElementById('upd-price').value);
  if(!price||price<=0)return;
  const changed=recordPh(name,price);
  // Update price in any pending shopping items with same name
  const k=name.toLowerCase().trim();
  let siChanged=false;
  S.si=S.si.map(i=>{
    if(i.name.toLowerCase().trim()===k&&!i.checked){siChanged=true;return{...i,price};}
    return i;
  });
  if(siChanged)persist('si',S.si);
  closeSheet();
  toast(changed?'Preço registrado ✓':'Preço igual ao último — nada alterado');
  render();
}
window.saveUpdatedPrice=saveUpdatedPrice;

  const totalEst=pending.reduce((s,i)=>(s+(i.price||0)*(i.qty||1)),0);
  const mx=monthTx();

  let html=`<div class="card c-pad mb12">

  </div>
  <button class="btn btn-pri btn-full mb12" onclick="openAddItem()">+ Adicionar item</button>`;

  if(!S.si.length){
    html+=`<div class="card empty"><div class="empty-ico">🛒</div><div class="empty-txt">Lista vazia</div><div class="empty-sub">Adicione itens com seus preços</div></div>`;
  }else{
    pending.forEach(item=>{
      const k=item.name.toLowerCase().trim();
      const hist=Array.isArray(S.ph[k])?S.ph[k]:null;
      const delta=priceDelta(hist);
      const price=item.price||0;
      const total=price*(item.qty||1);
      const enc=encodeURIComponent(item.name);

  {cat:'lazer',kw:['netflix','spotify','disney','hbo','globoplay','deezer','prime video','youtube premium','cinema','cinemark','ingresso','show','steam','playstation','xbox','nintendo','game','viagem','hotel','airbnb','booking','decolar','latam','gol ','azul ','123milhas','parque','clube']},
  {cat:'vestuario',kw:['renner','riachuelo','c&a','cea ','zara','marisa','nike','adidas','centauro','netshoes','calcado','sapato','roupa','vestuario','pernambucanas','hering','reserva','farm ','dafiti','shein','calzado']},
];
// --- Regras de categorização (receitas) ---
const DEFAULT_INC_RULES=[
  {cat:'salario',kw:['salario','pagamento salario','folha','provento','remuneracao','ordenado','vencimento','holerite','13']},
  {cat:'freelance',kw:['freela','freelance','servico prestado','autonomo','nota fiscal','nf-e','prestacao de servico','honorario']},
  {cat:'aluguel_r',kw:['aluguel recebido','locacao','imobiliaria']},
  {cat:'invest',kw:['rendiment','juros','dividendo','jcp','investiment','resgate','cdb','tesouro','lci','lca','poupanca','aplicacao']},
  {cat:'presente',kw:['pix recebido','transferencia recebida','ted recebida','doc recebido','deposito','presente','reembolso']},
];
function _learned(key){return lsGet(key,[]);}
function expRules(){return _learned('catRulesL').concat(DEFAULT_CAT_RULES);}
function incRules(){return _learned('incRulesL').concat(DEFAULT_INC_RULES);}
function categorize(desc,type){
  const d=(desc||'').toLowerCase();
  const rules=type==='income'?incRules():expRules();
  for(const r of rules){if(r.kw.some(k=>d.includes(k)))return r.cat;}
  return type==='income'?'outros_r':'outros';
}
function learnRule(desc,cat,type){
  const d=(desc||'').toLowerCase();
  const def=(type==='income'?DEFAULT_INC_RULES:DEFAULT_CAT_RULES);
  // se já cai numa regra padrão correta, não precisa aprender
  for(const r of def){if(r.kw.some(k=>d.includes(k))&&r.cat===cat)return;}
  const words=d.split(/[^a-zà-ú0-9&]+/).filter(w=>w.length>=4&&!/^\d+$/.test(w));
  if(!words.length)return;
  const token=words.sort((a,b)=>b.length-a.length)[0];
  const key=type==='income'?'incRulesL':'catRulesL';
  const L=_learned(key);
  const ex=L.find(r=>r.kw.includes(token));
  if(ex){ex.cat=cat;}else{L.unshift({kw:[token],cat});}
  lsSet(key,L.slice(0,300));
}

// --- Helpers de parsing ---
function impParseMoney(s){
  if(typeof s!=='string')s=String(s);
  s=s.replace(/\s/g,'').replace(/r\$/i,'').replace(/[^\d,.\-]/g,'');
  if(!s||s==='-')return NaN;
  if(s.includes(',')&&s.includes('.')){
    if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(s.includes(',')){s=s.replace(',','.');}
  return parseFloat(s);
}
function impParseDate(s){
  s=(s||'').trim();
  let m=s.match(/^(\d{4})(\d{2})(\d{2})/);if(m&&+m[2]>=1&&+m[2]<=12&&+m[3]>=1&&+m[3]<=31)return`${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})\b/);if(m)return`20${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function impCleanDesc(s){return (s||'').replace(/\s+/g,' ').trim().slice(0,70);}

// --- Parser OFX ---
function parseOFX(text){
  const rows=[];
  let blocks=text.match(/<STMTTRN>[\s\S]*?<\/STMTTRN>/gi);
  if(!blocks||!blocks.length)blocks=text.split(/<STMTTRN>/i).slice(1);
  (blocks||[]).forEach(b=>{
    const get=t=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():'';};
    const amt=impParseMoney(get('TRNAMT'));
    if(isNaN(amt))return;
    const memo=get('MEMO')||get('NAME')||get('CHECKNUM')||'Lançamento';
    rows.push({date:impParseDate(get('DTPOSTED'))||TODAY,amount:amt,desc:memo});
  });
  return rows;
}

// --- Parser CSV ---
function impDetectDelim(line){
  const c={';':(line.split(';').length),',':(line.split(',').length),'\t':(line.split('\t').length)};
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
}
function impSplitLine(line,d){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}
    else if(ch===d&&!q){out.push(cur);cur='';}
    else cur+=ch;}
  out.push(cur);return out.map(c=>c.trim());
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return[];
  const d=impDetectDelim(lines[0]);
  const grid=lines.map(l=>impSplitLine(l,d));
  let hIdx=-1,di=-1,vi=-1,ci=-1;
  for(let i=0;i<Math.min(grid.length,15);i++){
    const low=grid[i].map(c=>c.toLowerCase());
    const _d=low.findIndex(c=>/\b(data|date|dt)\b|data/.test(c));
    const _v=low.findIndex(c=>/valor|value|amount|montante|quantia|crédito|debito|débito/.test(c));
    const _c=low.findIndex(c=>/desc|hist|lanç|lanc|memo|detalhe|estabelec|transa|tipo|título/.test(c));
    if(_d>=0&&_v>=0){hIdx=i;di=_d;vi=_v;ci=_c;break;}
  }
  const rows=[];
  if(hIdx>=0){
    for(let i=hIdx+1;i<grid.length;i++){
      const g=grid[i];if(g.length<2)continue;
      const date=impParseDate(g[di]);const amt=impParseMoney(g[vi]);
      if(!date||isNaN(amt)||amt===0)continue;
      const desc=ci>=0?g[ci]:g.filter((c,idx)=>idx!==di&&idx!==vi).sort((a,b)=>b.length-a.length)[0]||'';
      rows.push({date,amount:amt,desc});
    }
  }else{
    // sem cabeçalho: heurística por linha
    grid.forEach(g=>{
      let date=null,amt=NaN,descCells=[];
      g.forEach(cell=>{
        const dd=impParseDate(cell);
        const mm=/^-?\s?r?\$?\s?-?\d{1,3}(\.\d{3})*,\d{2}$|^-?\d+\.\d{2}$/i.test(cell.trim())?impParseMoney(cell):NaN;
        if(dd&&!date)date=dd;
        else if(!isNaN(mm)&&isNaN(amt))amt=mm;
        else if(cell.replace(/[\d\/\-.,r$\s]/gi,'').length>2)descCells.push(cell);
      });
      if(date&&!isNaN(amt)&&amt!==0)rows.push({date,amount:amt,desc:descCells.sort((a,b)=>b.length-a.length)[0]||''});
    });
  }
  return rows;
}

// --- Parser de texto/linhas (PDF e colado) ---
function parseTextLines(text){
  const rows=[];
  text.split(/\r?\n/).forEach(line=>{
    const dm=line.match(/\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{4}-\d{2}-\d{2}/);
    if(!dm)return;
    const monies=line.match(/-?\s?r?\$?\s?-?\d{1,3}(?:\.\d{3})*,\d{2}|-?\d+\.\d{2}\b/gi);
    if(!monies||!monies.length)return;
    let amt=impParseMoney(monies[monies.length-1]);
    if(isNaN(amt)||amt===0)return;
    // descrição (sem data e sem valores)
    let descTmp=line.replace(dm[0],' ');monies.forEach(mo=>{descTmp=descTmp.replace(mo,' ');});
    const dlow=descTmp.toLowerCase();
    const low=line.toLowerCase();
    // sinal: padrão = despesa; vira receita só com marcador de crédito ou palavra de entrada
    const lastMoney=monies[monies.length-1];
    const hasMinus=/-/.test(lastMoney)||/-\s*$/.test(low.slice(0,line.indexOf(lastMoney)));
    const credMark=/\bc\b|crédito|credito|\(c\)|\+/.test(low.slice(line.indexOf(lastMoney)))||/\bc\b|crédito|credito/.test(low.split(lastMoney)[0].slice(-4));
    const debMark=/\bd\b|débito|debito|\(d\)/.test(low.slice(line.indexOf(lastMoney)));
    const incomeWord=incRules().some(r=>r.kw.some(k=>dlow.includes(k)));
    let sign=-1;
    if(hasMinus||debMark)sign=-1;
    else if(credMark||incomeWord)sign=1;
    amt=sign*Math.abs(amt);
    let desc=line.replace(dm[0],' ');
    monies.forEach(mo=>{desc=desc.replace(mo,' ');});
    desc=desc.replace(/\b[dc]\b/gi,' ');
    rows.push({date:impParseDate(dm[0])||TODAY,amount:amt,desc:impCleanDesc(desc)});
  });
  return rows;
}

// --- PDF.js (carregado sob demanda, só quando precisa) ---
function loadPdfJs(){
  return new Promise((res,rej)=>{
    if(window.pdfjsLib)return res();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}res();};
    s.onerror=()=>rej(new Error('CDN'));document.head.appendChild(s);
  });
}
async function extractPdfText(buf){
  await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);const tc=await page.getTextContent();
    const lines={};
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push(it.str);});
    Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{out+=lines[y].join(' ')+'\n';});
  }
  return out;
}

// --- Entrada: arquivo escolhido ---
function handleStatementFile(file){
  if(!file)return;
  const name=(file.name||'').toLowerCase();
  toast('Lendo extrato…');
  const reader=new FileReader();
  if(name.endsWith('.pdf')){
    reader.onload=async e=>{try{const txt=await extractPdfText(e.target.result);finishImportParse(parseTextLines(txt));}catch(err){console.error(err);toast('Não consegui ler o PDF. Tente OFX ou CSV.');}};
    reader.readAsArrayBuffer(file);
  }else{
    reader.onload=e=>{
      const txt=e.target.result;let rows;
      if(name.endsWith('.ofx')||/<ofx>|<stmttrn>/i.test(txt))rows=parseOFX(txt);
      else if(name.endsWith('.csv')||/[;,]\s*\S/.test(txt.split(/\r?\n/)[0]||''))rows=parseCSV(txt);
      else rows=parseTextLines(txt);
      if(!rows||!rows.length)rows=parseTextLines(txt);
      finishImportParse(rows);
    };
    reader.readAsText(file,'utf-8');
  }
}
function impIsDup(o){
  const target=o.type==='income'?S.inc:S.tx;
  return target.some(t=>{const td=new Date(t.date);const ds=`${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,'0')}-${String(td.getDate()).padStart(2,'0')}`;return ds===o.date&&Math.abs(t.amount-o.absAmount)<0.005;});
}
function finishImportParse(rows){
  rows=(rows||[]).filter(r=>r&&r.date&&!isNaN(r.amount)&&Math.abs(r.amount)>0);
  if(!rows.length){toast('Nenhuma transação encontrada no arquivo.');return;}
  window._importRows=rows.map(r=>{
    const type=r.amount<0?'expense':'income';
    const o={date:r.date,absAmount:Math.abs(r.amount),desc:impCleanDesc(r.desc),type,cat:categorize(r.desc,type)};
    o.dup=impIsDup(o);o.include=!o.dup;return o;
  });
  openImportReview();
}

// --- Tela de revisão ---
function impCatOptions(sel,type){
  return (type==='income'?ICATS:CATS).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.icon} ${c.label}</option>`).join('');
}
function impRowHTML(r,i){
  const inc=r.type==='income';
  return `<div class="card" style="padding:10px;margin-bottom:8px;${r.dup?'opacity:.5':''}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <input type="checkbox" ${r.include?'checked':''} onchange="impToggle(${i},this.checked)" style="width:18px;height:18px;flex-shrink:0;accent-color:var(--pri)">
      <div style="flex:1;min-width:0">
        <div class="item-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.desc||'(sem descrição)'}</div>
        <div class="item-sub">${r.date}${r.dup?' · <span style="color:var(--amb)">já existe</span>':''}</div>
      </div>
      <div style="font-weight:700;font-size:14px;color:${inc?'var(--grn)':'var(--pri)'}">${inc?'+':'−'}${fmtS(r.absAmount)}</div>
    </div>
    <div style="display:flex;gap:6px">
      <select class="f-inp" style="flex:1;padding:6px 8px;font-size:12px" onchange="impSetCat(${i},this.value)">${impCatOptions(r.cat,r.type)}</select>
      <button class="btn btn-ghost btn-sm" onclick="impFlip(${i})" style="white-space:nowrap">${inc?'Receita':'Despesa'} ↔</button>
    </div>
  </div>`;
}
function renderImportList(){
  const el=document.getElementById('imp-list');if(!el)return;
  el.innerHTML=window._importRows.map((r,i)=>impRowHTML(r,i)).join('');
  const n=window._importRows.filter(r=>r.include).length;
  const cnt=document.getElementById('imp-count');if(cnt)cnt.textContent=n;
}
window.impToggle=(i,v)=>{window._importRows[i].include=v;const cnt=document.getElementById('imp-count');if(cnt)cnt.textContent=window._importRows.filter(r=>r.include).length;};
window.impSetCat=(i,v)=>{window._importRows[i].cat=v;};
window.impFlip=i=>{const r=window._importRows[i];r.type=r.type==='income'?'expense':'income';r.cat=categorize(r.desc,r.type);renderImportList();};
window.impSelectAll=v=>{window._importRows.forEach(r=>r.include=v);renderImportList();};
function openImportReview(){
  const tot=window._importRows.length,sel=window._importRows.filter(r=>r.include).length;
  sheet(`<div class="sheet-drag"></div><div class="sheet-title">Revisar importação</div>
    <div style="font-size:12px;color:var(--txm);margin-bottom:10px">${tot} transações encontradas · <b id="imp-count">${sel}</b> selecionadas. Confira a categoria e desmarque o que não quer importar.</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="impSelectAll(true)">Marcar todos</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="impSelectAll(false)">Desmarcar todos</button>
    </div>
    <div id="imp-list">${window._importRows.map((r,i)=>impRowHTML(r,i)).join('')}</div>
    <button class="btn btn-pri btn-full" style="margin-top:6px" onclick="confirmImport()">Importar selecionados</button>
  `);
}
function confirmImport(){
  const rows=(window._importRows||[]).filter(r=>r.include);
  if(!rows.length){toast('Nada selecionado.');return;}
  let nE=0,nI=0;
  rows.forEach(r=>{
    const iso=new Date(r.date+'T12:00:00').toISOString();
    if(r.type==='income'){S.inc.push({id:uid(),amount:r.absAmount,category:r.cat,label:r.desc||'Importado',user:'u1',date:iso});nI++;}
    else{S.tx.push({id:uid(),amount:r.absAmount,category:r.cat,label:r.desc||'Importado',user:'u1',date:iso});nE++;}
    learnRule(r.desc,r.cat,r.type);
  });
  persist('tx',S.tx);persist('inc',S.inc);
  window._importRows=null;
  closeSheet();render();
  toast(`Importado: ${nE} despesa(s), ${nI} receita(s) ✓`);
}

function sheet(html){
  const s=document.getElementById('sheet');
  const o=document.getElementById('overlay');
  s.innerHTML=html;
  s.style.display='block';o.style.display='block';
  requestAnimationFrame(()=>{s.style.transform='translateY(0)';});
}
function closeSheet(){
  document.getElementById('sheet').style.display='none';
  document.getElementById('overlay').style.display='none';
}
