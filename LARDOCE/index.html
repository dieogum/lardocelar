<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" href="icone.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF7F0" id="theme-meta">
<title>Lar & Vida</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAF7F0;--surf:#FFF;--brd:#EAE2D4;--brds:#F3EDE2;
  --pri:#C14B2A;--pris:#FAE9E4;
  --grn:#4A865A;--grns:#E2F0E6;
  --amb:#C5820A;--ambs:#FBF2D8;
  --txt:#1C1208;--txm:#6B5A48;--txl:#A09080;
  --shd:0 1px 8px rgba(0,0,0,.07);
}
body.dark{
  --bg:#131110;--surf:#1E1A17;--brd:#332C26;--brds:#29231D;
  --txt:#F2EDE4;--txm:#BBA888;--txl:#7A6858;
  --shd:0 1px 8px rgba(0,0,0,.3);
}
body{background:var(--bg);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .2s}
#app-wrap{max-width:480px;margin:0 auto}
input,button,textarea,select{font-family:inherit}
button{cursor:pointer}

/* ── PIN ── */
#pin-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
#pin-box{text-align:center;width:100%}
#pin-box .logo{font-size:52px;margin-bottom:12px}
#pin-box h1{font-size:26px;font-weight:700;color:var(--txt);margin-bottom:6px}
#pin-box p{font-size:13px;color:var(--txl);margin-bottom:28px}
#pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:10px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brd);background:var(--brds);transition:background .15s}
.dot.filled{background:var(--pri);border-color:var(--pri)}
#pin-err{font-size:12px;color:var(--pri);min-height:18px;margin-bottom:8px}
#keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto}
.kbtn{background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:16px;font-size:22px;font-weight:600;color:var(--txt);transition:background .1s}
.kbtn:active{background:var(--brds)}
.kbtn.del{font-size:18px;color:var(--txm)}

/* ── APP ── */
#app{display:none;padding-bottom:76px}
header{background:var(--surf);border-bottom:1px solid var(--brd);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.h-title{font-size:20px;font-weight:700;color:var(--txt);letter-spacing:-.3px}
.h-sub{font-size:11px;color:var(--txl)}
.h-right{display:flex;align-items:center;gap:6px}
.badge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500}
.badge-r{background:var(--pris);color:var(--pri)}
.badge-g{background:var(--grns);color:var(--grn)}
#sync-btn{background:none;border:none;font-size:17px;color:var(--txl);padding:4px;line-height:1}
#content{padding:14px 14px 0}
nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--brd);display:flex;padding-bottom:4px;z-index:40}
.nb{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:10px;color:var(--txl);font-weight:400;transition:color .1s}
.nb.on{color:var(--pri);font-weight:600}
.nb-ico{font-size:20px;line-height:1}
.nb-bar{width:18px;height:2px;background:var(--pri);border-radius:1px}

/* ── SHEET MODAL ── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none}
#sheet{position:fixed;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:480px;background:var(--surf);border-radius:20px 20px 0 0;padding:20px 18px 48px;max-height:90vh;overflow-y:auto;overflow-x:hidden;z-index:90;display:none}
.sheet-drag{width:36px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:18px;font-weight:700;color:var(--txt);margin-bottom:16px}

/* ── CARDS ── */
.card{background:var(--surf);border-radius:16px;box-shadow:var(--shd);border:1px solid var(--brd)}
.c-pad{padding:16px}
.row{display:flex;align-items:center;justify-content:space-between}
.mb8{margin-bottom:8px}
.mb12{margin-bottom:12px}
.mb14{margin-bottom:14px}

/* ── FORM ── */
.f-label{font-size:12px;color:var(--txm);font-weight:500;margin-bottom:4px}
.f-inp{width:100%;border:1px solid var(--brd);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--txt);background:var(--bg);outline:none;transition:border-color .15s}
.f-inp:focus{border-color:var(--pri)}
textarea.f-inp{resize:vertical;min-height:90px}
.f-group{margin-bottom:12px}

/* ── BUTTONS ── */
.btn{border:none;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;font-family:inherit}
.btn:active{opacity:.8}
.btn-pri{background:var(--pri);color:#FFF}
.btn-sec{background:transparent;border:1.5px solid var(--pri);color:var(--pri)}
.btn-grn{background:var(--grn);color:#FFF}
.btn-amb{background:var(--amb);color:#FFF}
.btn-ghost{background:var(--brds);color:var(--txm);border:none}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-full{width:100%}
.btn-row{display:flex;gap:8px;margin-bottom:14px}

/* ── PROGRESS BAR ── */
.prog-wrap{background:var(--brds);border-radius:6px;height:8px;overflow:hidden}
.prog-bar{height:100%;border-radius:6px;transition:width .5s}

/* ── CAT GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-btn{background:var(--bg);border:1.5px solid var(--brd);border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center;transition:border-color .1s}
.cat-btn.on{border-color:currentColor}
.cat-ico{font-size:18px}
.cat-lbl{font-size:10px;color:var(--txl);font-weight:500;margin-top:2px}

/* ── USER PICK ── */
.up-row{display:flex;gap:8px;margin-bottom:14px}
.up-btn{flex:1;border:1.5px solid var(--brd);border-radius:10px;padding:9px 4px;cursor:pointer;font-weight:600;font-size:12px;color:var(--txm);background:var(--bg);transition:all .1s;font-family:inherit}
.up-btn.on-r{background:var(--pris);border-color:var(--pri);color:var(--pri)}
.up-btn.on-g{background:var(--grns);border-color:var(--grn);color:var(--grn)}
.up-btn.on-a{background:var(--ambs);border-color:var(--amb);color:var(--amb)}

/* ── ITEMS ── */
.item-row{padding:10px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.item-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.item-name{font-size:13px;font-weight:500;color:var(--txt)}
.item-sub{font-size:11px;color:var(--txl)}
.x-btn{background:none;border:none;cursor:pointer;color:var(--txl);font-size:20px;line-height:1;padding:0 3px}
.edit-btn{background:none;border:none;cursor:pointer;color:var(--txl);font-size:15px;line-height:1;padding:0 3px}
.check-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--brd);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check-box.done{border:none;background:var(--grn);color:#FFF;font-size:12px}

/* ── DONUT CHART ── */
#chart-wrap{display:flex;align-items:center;gap:16px;margin-bottom:8px}
#donut{flex-shrink:0}
#chart-legend{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.leg-row{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txm)}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── CALENDAR ── */
.week-grid{display:flex;gap:4px}
.day-btn{flex:1;padding:8px 2px;border-radius:10px;cursor:pointer;text-align:center;background:var(--bg);border:1.5px solid var(--brd);font-family:inherit;transition:background .1s}
.day-btn.today{background:var(--pri);border-color:var(--pri)}
.day-name{font-size:10px;color:var(--txl);margin-bottom:2px}
.day-num{font-size:14px;font-weight:700;color:var(--txt)}
.day-btn.today .day-name,.day-btn.today .day-num{color:#FFF}
.day-dot{width:4px;height:4px;border-radius:2px;background:var(--amb);margin:2px auto 0}
.day-btn.today .day-dot{background:#FFF9}
.ev-card{padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.ev-line{width:3px;border-radius:1.5px;align-self:stretch;flex-shrink:0;margin-right:10px}

/* ── SHOPPING ── */
#shop-summary{display:flex;gap:12px;margin-bottom:12px}
.sum-col{flex:1;text-align:center}
.sum-val{font-size:17px;font-weight:700}
.sum-lbl{font-size:11px;color:var(--txl)}
.warn-box{margin-top:10px;background:#FEE8E3;border-radius:8px;padding:7px 12px;font-size:12px;color:var(--pri)}
.shop-done-hdr{font-size:11px;color:var(--txl);margin:10px 0 7px}

/* ── NOTES ── */
#notes-grid{columns:2;gap:10px}
.note-card{border-radius:14px;padding:13px;margin-bottom:10px;break-inside:avoid;position:relative;border:1px solid transparent}
.note-xtitle{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:5px;padding-right:20px}
.note-body{font-size:12px;color:var(--txm);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.note-foot{font-size:10px;color:var(--txl);margin-top:8px}
.note-x{position:absolute;top:8px;right:9px;background:none;border:none;cursor:pointer;font-size:18px;line-height:1}

/* ── SETTINGS ── */
.set-section{font-size:11px;font-weight:700;color:var(--txl);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--brds)}
.setting-label{font-size:13px;font-weight:500;color:var(--txt)}
.setting-sub{font-size:11px;color:var(--txl);margin-top:2px}

/* ── SCAN ── */
.scan-drop{background:var(--bg);border:2px dashed var(--brd);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;margin-bottom:14px}
.scan-ico{font-size:36px;margin-bottom:8px}

/* ── EMPTY STATE ── */
.empty{padding:28px;text-align:center}
.empty-ico{font-size:28px;margin-bottom:6px}
.empty-txt{color:var(--txl);font-size:13px}
.empty-sub{color:var(--txl);font-size:12px;margin-top:3px}

/* ── TOAST ── */
#toast{position:fixed;bottom:90px;left:0;right:0;margin:0 auto;width:fit-content;max-width:320px;background:rgba(28,18,8,.88);color:#FFF;padding:9px 18px;border-radius:20px;font-size:13px;display:none;z-index:200;text-align:center}

/* ── WEEK NAV ── */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wn-btn{background:var(--bg);border:1px solid var(--brd);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.wn-lbl{font-size:13px;font-weight:600;color:var(--txt)}
.day-section{margin-bottom:14px}
.day-section-hdr{font-size:11px;font-weight:600;color:var(--txm);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.today-tag{background:var(--pri);color:#FFF;border-radius:4px;padding:1px 6px;font-size:10px}

/* ── NOTE PALETTES ── */
.pal-row{display:flex;gap:8px;margin-bottom:14px}
.pal-btn{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2.5px solid transparent;transition:border-color .1s}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:9px 14px}
.mn-btn{background:none;border:none;font-size:22px;color:var(--txm);cursor:pointer;padding:0 4px;line-height:1}
.mn-lbl{font-size:14px;font-weight:700;color:var(--txt)}

/* ── BALANCE CARD ── */
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.bal-col{padding:10px 14px;text-align:center}
.bal-col:first-child{border-right:1px solid var(--brds)}
.bal-val{font-size:15px;font-weight:700;margin-bottom:2px}
.bal-lbl{font-size:10px;color:var(--txl)}
.bal-divider{height:1px;background:var(--brds);margin:0 14px}
.bal-saldo{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.bal-saldo-lbl{font-size:11px;color:var(--txl)}
.bal-saldo-val{font-size:20px;font-weight:800}

/* ── TOGGLE ── */
.toggle{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:var(--brd);border-radius:26px;cursor:pointer;transition:.2s}
.tslider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#FFF;border-radius:50%;transition:.2s}
input:checked+.tslider{background:var(--grn)}
input:checked+.tslider:before{transform:translateX(18px)}

/* ── RECURRING ── */
.rec-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px}
.rec-badge{font-size:9px;background:var(--ambs);color:var(--amb);border-radius:4px;padding:1px 5px;font-weight:600;margin-left:4px}
.inc-badge{font-size:9px;background:var(--grns);color:var(--grn);border-radius:4px;padding:1px 5px;font-weight:600;margin-left:4px}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--brd);margin:14px 0}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div id="pin-box">
    <div class="logo">🏡</div>
    <h1>Lar & Vida</h1>
    <p>Digite o PIN de acesso</p>
    <div id="pin-dots">
      <div class="dot" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
    <div id="pin-err"></div>
    <div id="keypad"></div>
  </div>
</div>

<!-- APP -->
<div id="app-wrap">
  <div id="app">
    <header>
      <div>
        <div class="h-title">Lar & Vida</div>
        <div class="h-sub" id="h-month"></div>
      </div>
      <div class="h-right" id="h-right"></div>
    </header>
    <div id="content"></div>
    <nav id="nav"></nav>
  </div>
</div>

<!-- OVERLAY + SHEET -->
<div id="overlay" onclick="closeSheet()"></div>
<div id="sheet"></div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════
const CATS=[
  {id:'alimentacao',label:'Alimentação',icon:'🛒',color:'#C5820A'},
  {id:'moradia',    label:'Moradia',    icon:'🏠',color:'#3A72A8'},
  {id:'transporte', label:'Transporte', icon:'🚗',color:'#4A865A'},
  {id:'saude',      label:'Saúde',      icon:'💊',color:'#C14B2A'},
  {id:'educacao',   label:'Educação',   icon:'📚',color:'#7060B0'},
  {id:'lazer',      label:'Lazer',      icon:'🎭',color:'#B0508A'},
  {id:'vestuario',  label:'Vestuário',  icon:'👕',color:'#1A9A90'},
  {id:'outros',     label:'Outros',     icon:'📦',color:'#8A8A8A'},
];
const ICATS=[
  {id:'salario',    label:'Salário',    icon:'💼',color:'#4A865A'},
  {id:'freelance',  label:'Freelance',  icon:'💻',color:'#3A72A8'},
  {id:'aluguel_r',  label:'Aluguel',    icon:'🏘',color:'#7060B0'},
  {id:'invest',     label:'Investimento',icon:'📈',color:'#C5820A'},
  {id:'presente',   label:'Presente',   icon:'🎁',color:'#B0508A'},
  {id:'outros_r',   label:'Outros',     icon:'💵',color:'#8A8A8A'},
];
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
              'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DNAMES=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DFULL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const NPALS=[
  {bg:'#FFFBDC',bdr:'#E8D840'},{bg:'#E6F5E8',bdr:'#6AB87A'},
  {bg:'#F0E8F8',bdr:'#B080D8'},{bg:'#E2EEF8',bdr:'#6A9ED0'},
  {bg:'#FDEAE4',bdr:'#D07060'},
];

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const NOW=new Date();
const S={
  tab:'financas', weekOff:0,
  viewMonth:NOW.getMonth(), viewYear:NOW.getFullYear(),
  orc:5000, tx:[], inc:[], rec:[], ev:[], si:[], ph:{}, nt:[],
  unames:['Você','Cônjuge'], pin:'1234',
  syncUrl:'', syncPass:'', claudeKey:'',
  darkMode:false,
};

// ═══════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════
function lsGet(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v))}

function loadAll(){
  S.orc=lsGet('orc',5000); S.tx=lsGet('tx',[]); S.inc=lsGet('inc',[]);
  S.rec=lsGet('rec',[]); S.ev=lsGet('ev',[]);
  S.si=lsGet('si',[]); S.ph=lsGet('ph',{}); S.nt=lsGet('nt',[]);
  S.unames=lsGet('un',['Você','Cônjuge']); S.pin=lsGet('pin','1234');
  S.syncUrl=lsGet('syncUrl',''); S.syncPass=lsGet('syncPass','');
  S.claudeKey=lsGet('claudeKey',''); S.darkMode=lsGet('darkMode',false);
  applyDark();
  applyRecurring();
}

function persist(key,val){
  lsSet(key,val);
  queueSync(key,val);
}

// ═══════════════════════════════════════════════════
// DARK MODE
// ═══════════════════════════════════════════════════
function applyDark(){
  document.body.classList.toggle('dark',S.darkMode);
  const m=document.getElementById('theme-meta');
  if(m)m.content=S.darkMode?'#131110':'#FAF7F0';
}
function toggleDark(){
  S.darkMode=!S.darkMode;
  lsSet('darkMode',S.darkMode);
  applyDark();
}

// ═══════════════════════════════════════════════════
// SYNC
// ═══════════════════════════════════════════════════
let syncQ={}, syncTimer=null, syncing=false;
const DATA_KEYS=['orc','tx','inc','rec','ev','si','ph','nt','un'];

function queueSync(key,val){
  if(!DATA_KEYS.includes(key))return;
  syncQ[key]={val:JSON.stringify(val),ts:Date.now()};
  clearTimeout(syncTimer);
  syncTimer=setTimeout(flushSync,2500);
}

async function flushSync(){
  if(syncing||!S.syncUrl||!S.syncPass||!navigator.onLine)return;
  const q={...syncQ};
  if(!Object.keys(q).length)return;
  syncing=true; setSyncIcon('⏫');
  try{
    const fd=new URLSearchParams();
    fd.append('p',S.syncPass);fd.append('a','push');fd.append('d',JSON.stringify(q));
    const r=await fetch(S.syncUrl,{method:'POST',body:fd,redirect:'follow'});
    const data=await r.json();
    if(data.ok){syncQ={};setSyncIcon('✓');lsSet('lastSync',Date.now());}
    else setSyncIcon('⚠');
  }catch{setSyncIcon('⚠');}
  syncing=false;
}

async function pullSync(){
  if(!S.syncUrl||!S.syncPass||!navigator.onLine)return;
  setSyncIcon('⏬');
  try{
    const r=await fetch(`${S.syncUrl}?a=pull&p=${encodeURIComponent(S.syncPass)}`,{redirect:'follow'});
    const data=await r.json();
    if(data.ok&&data.d){
      for(const[k,{val,ts}]of Object.entries(data.d)){
        const localTs=lsGet('ts_'+k,0);
        if(ts>localTs){localStorage.setItem(k,val);lsSet('ts_'+k,ts);}
      }
      loadAll(); render(); setSyncIcon('✓'); toast('Dados sincronizados ✓');
    }
  }catch{setSyncIcon('⚠');}
}

function setSyncIcon(ico){
  const el=document.getElementById('sync-btn');
  if(el)el.textContent=ico;
}

// ═══════════════════════════════════════════════════
// RECURRING EXPENSES
// ═══════════════════════════════════════════════════
function applyRecurring(){
  if(!S.rec.length)return;
  const key=`${NOW.getFullYear()}-${NOW.getMonth()}`;
  const applied=lsGet('recApplied',{});
  const done=applied[key]||[];
  let changed=false;
  S.rec.forEach(r=>{
    if(!done.includes(r.id)){
      const day=Math.min(r.day||1,28);
      const d=new Date(NOW.getFullYear(),NOW.getMonth(),day);
      S.tx.push({id:uid(),amount:r.amount,category:r.category,label:r.label,user:r.user||'u1',date:d.toISOString(),isRec:true,recId:r.id});
      done.push(r.id);
      changed=true;
    }
  });
  if(changed){applied[key]=done;lsSet('recApplied',applied);lsSet('tx',S.tx);}
}

// ═══════════════════════════════════════════════════
async function requestNotifications(){
  if(!('Notification' in window)){toast('Navegador sem suporte a notificações');return false;}
  const p=await Notification.requestPermission();
  const ok=p==='granted';
  lsSet('notifEnabled',ok);
  toast(ok?'Notificações ativadas ✓':'Permissão negada pelo sistema');
  return ok;
}

function checkAndNotify(){
  if(!lsGet('notifEnabled',false))return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const shown=lsGet('notifShown',{});
  const todayShown=shown[TODAY]||[];
  const tmrw=new Date(NOW);tmrw.setDate(tmrw.getDate()+1);
  const tmrwKey=toDS(tmrw);

  S.ev.filter(e=>e.date===TODAY).forEach(ev=>{
    if(!todayShown.includes(ev.id+'_d')){
      new Notification('📅 Hoje: '+ev.title,{body:ev.time?'às '+ev.time:'',icon:'icone.png'});
      todayShown.push(ev.id+'_d');
    }
    // Schedule timed notification for today
    if(ev.time){
      const[h,m]=ev.time.split(':').map(Number);
      const t=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate(),h,m).getTime()-Date.now();
      if(t>0&&t<8*60*60*1000&&!todayShown.includes(ev.id+'_t')){
        setTimeout(()=>{
          new Notification('⏰ '+ev.title,{body:'Agora!',icon:'icone.png'});
          toast('⏰ '+ev.title);
        },t);
        todayShown.push(ev.id+'_t');
      }
    }
  });

  // Tomorrow reminder
  S.ev.filter(e=>e.date===tmrwKey).forEach(ev=>{
    if(!todayShown.includes(ev.id+'_tmr')){
      new Notification('📅 Amanhã: '+ev.title,{body:ev.time?'às '+ev.time:'',icon:'icone.png'});
      todayShown.push(ev.id+'_tmr');
    }
  });

  shown[TODAY]=todayShown;
  lsSet('notifShown',shown);
}

function exportBackup(){
  const data={version:2,date:TODAY,orc:S.orc,tx:S.tx,inc:S.inc,rec:S.rec,ev:S.ev,si:S.si,ph:S.ph,nt:S.nt,un:S.unames};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='larvida-backup-'+TODAY+'.json';
  a.click();
  toast('Backup baixado ✓');
}

function importBackup(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.version)throw new Error('Arquivo inválido');
      S.orc=d.orc||5000;S.tx=d.tx||[];S.inc=d.inc||[];S.rec=d.rec||[];
      S.ev=d.ev||[];S.si=d.si||[];S.ph=d.ph||{};S.nt=d.nt||[];
      S.unames=d.un||['Você','Cônjuge'];
      lsSet('orc',S.orc);lsSet('tx',S.tx);lsSet('inc',S.inc);lsSet('rec',S.rec);
      lsSet('ev',S.ev);lsSet('si',S.si);lsSet('ph',S.ph);lsSet('nt',S.nt);
      lsSet('un',S.unames);
      closeSheet();render();toast('Backup restaurado ✓');
    }catch(err){toast('Arquivo de backup inválido');}
  };
  reader.readAsText(file);
}

const fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtS=n=>`R$ ${n.toFixed(2).replace('.',',')}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toDS(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const TODAY=toDS(NOW);

function getWeekDays(off=0){
  const b=new Date(NOW);
  b.setDate(b.getDate()-b.getDay()+off*7);
  return Array.from({length:7},(_,i)=>new Date(b.getFullYear(),b.getMonth(),b.getDate()+i));
}
function getEst(name){
  const k=name.toLowerCase().trim();
  if(S.ph[k])return S.ph[k];
  const h=Object.keys(S.ph).find(p=>p.includes(k)||k.includes(p));
  return h?S.ph[h]:null;
}
function monthTx(){
  return S.tx.filter(t=>{const d=new Date(t.date);return d.getMonth()===S.viewMonth&&d.getFullYear()===S.viewYear;});
}
function monthInc(){
  return S.inc.filter(t=>{const d=new Date(t.date);return d.getMonth()===S.viewMonth&&d.getFullYear()===S.viewYear;});
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>el.style.display='none',2200);
}
function isViewingNow(){return S.viewMonth===NOW.getMonth()&&S.viewYear===NOW.getFullYear();}
function prevMonth(){
  if(S.viewMonth===0){S.viewMonth=11;S.viewYear--;}else S.viewMonth--;
  render();
}
function nextMonth(){
  if(S.viewMonth===11){S.viewMonth=0;S.viewYear++;}else S.viewMonth++;
  render();
}

let pinInput='';
function buildKeypad(){
  const kp=document.getElementById('keypad');
  const nums=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  kp.innerHTML=nums.map(n=>{
    if(n==='')return`<div></div>`;
    return`<button class="kbtn${n==='⌫'?' del':''}" onclick="pinKey('${n}')">${n}</button>`;
  }).join('');
}
function pinKey(k){
  if(k==='⌫'){pinInput=pinInput.slice(0,-1);}
  else if(pinInput.length<4){pinInput+=k;}
  updateDots();
  if(pinInput.length===4)setTimeout(checkPin,80);
}
function updateDots(){
  for(let i=0;i<4;i++){
    document.getElementById('d'+i).className='dot'+(i<pinInput.length?' filled':'');
  }
}
function checkPin(){
  if(pinInput===S.pin){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('app').style.display='block';
    render();
    setTimeout(checkAndNotify,1000);
    if(S.syncUrl&&S.syncPass)pullSync();
    window.addEventListener('online',()=>{flushSync();pullSync();});
  }else{
    document.getElementById('pin-err').textContent='PIN incorreto. Tente novamente.';
    pinInput='';updateDots();
    setTimeout(()=>document.getElementById('pin-err').textContent='',1500);
  }
}

function renderFinancas(el){
  const mx=monthTx();
  const mi=monthInc();
  const spent=mx.reduce((s,t)=>s+t.amount,0);
  const earned=mi.reduce((s,t)=>s+t.amount,0);
  const saldo=earned-spent;
  const pct=S.orc>0?Math.min(100,(spent/S.orc)*100):0;
  const rem=S.orc-spent;
  const barC=pct>90?'var(--pri)':pct>70?'var(--amb)':'var(--grn)';
  const catTots=CATS.map(c=>({...c,v:mx.filter(t=>t.category===c.id).reduce((s,t)=>s+t.amount,0)})).filter(c=>c.v>0);
  const catTotal=catTots.reduce((s,c)=>s+c.v,0);

  // Month navigation
  let html=`<div class="month-nav">
    <button class="mn-btn" onclick="prevMonth()">‹</button>
    <span class="mn-lbl">${MONTHS[S.viewMonth]} ${S.viewYear}${isViewingNow()?' · Atual':''}</span>
    <button class="mn-btn" onclick="nextMonth()">›</button>
  </div>`;

  // Balance card
  html+=`<div class="card mb12">
    <div class="bal-grid">
      <div class="bal-col">
        <div class="bal-val" style="color:var(--grn)">${fmt(earned)}</div>
        <div class="bal-lbl">↑ Receitas</div>
      </div>
      <div class="bal-col">
        <div class="bal-val" style="color:var(--pri)">${fmt(spent)}</div>
        <div class="bal-lbl">↓ Despesas</div>
      </div>
    </div>
    <div class="bal-divider"></div>
    <div class="bal-saldo">
      <span class="bal-saldo-lbl">Saldo do mês</span>
      <span class="bal-saldo-val" style="color:${saldo>=0?'var(--grn)':'var(--pri)'}">${fmt(saldo)}</span>
    </div>
  </div>`;

  // Budget
  html+=`<div class="card c-pad mb12">
    <div class="row mb8">
      <div>
        <div style="font-size:11px;color:var(--txl);margin-bottom:1px">Orçamento de despesas</div>
        <div style="font-size:20px;font-weight:700;color:var(--txt)">${fmt(S.orc)}</div>
      </div>
      <button class="btn btn-sm btn-ghost" onclick="openEditOrc()">Editar</button>
    </div>
    <div class="row mb8">
      <div style="font-size:12px;color:var(--txm)">Gasto: <b>${fmt(spent)}</b></div>
      <div style="font-size:12px;color:${rem<0?'var(--pri)':'var(--txm)'}">Restante: <b style="color:${rem<0?'var(--pri)':'var(--grn)'}">${fmt(rem)}</b></div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${pct.toFixed(1)}%;background:${barC}"></div></div>
    <div style="font-size:11px;color:var(--txl);margin-top:4px">${pct.toFixed(0)}% utilizado</div>
  </div>`;

  // Donut chart
  if(catTots.length){
    html+=`<div class="card c-pad mb12">
      <div style="font-size:12px;font-weight:600;color:var(--txm);margin-bottom:10px">Distribuição de despesas</div>
      <div id="chart-wrap">
        <canvas id="donut" width="120" height="120"></canvas>
        <div id="chart-legend">${catTots.map(c=>`
          <div class="leg-row">
            <div class="leg-dot" style="background:${c.color}"></div>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.label}</span>
            <span style="font-weight:600;flex-shrink:0">${fmt(c.v)}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  // Action buttons
  html+=`<div class="btn-row">
    <button class="btn btn-grn" style="flex:1;font-size:13px" onclick="openAddInc()">+ Receita</button>
    <button class="btn btn-pri" style="flex:1;font-size:13px" onclick="openAddTx()">+ Despesa</button>
  </div>`;

  // Transaction list (merged)
  const allItems=[
    ...mx.map(t=>({...t,_type:'exp'})),
    ...mi.map(t=>({...t,_type:'inc'})),
  ].sort((a,b)=>new Date(b.date)-new Date(a.date));

  html+=`<div style="font-size:12px;font-weight:600;color:var(--txm);margin-bottom:10px">Lançamentos de ${MONTHS[S.viewMonth]}</div>`;

  if(!allItems.length){
    html+=`<div class="card empty"><div class="empty-ico">💸</div><div class="empty-txt">Nenhum lançamento esse mês</div></div>`;
  }else{
    allItems.slice(0,30).forEach(t=>{
      if(t._type==='exp'){
        const c=CATS.find(c=>c.id===t.category)||CATS[7];
        const who=t.user==='u1'?S.unames[0]:t.user==='u2'?S.unames[1]:'Ambos';
        html+=`<div class="card item-row">

        html+=`<div class="card item-row">
          <div class="item-ico" style="background:${c.color}22">${c.icon}</div>
          <div style="flex:1;min-width:0">
            <div class="item-name">${t.label||c.label}<span class="inc-badge">RECEITA</span></div>
            <div class="item-sub">${c.label} · ${who}</div>
          </div>
          <div style="font-size:14px;font-weight:700;color:var(--grn);flex-shrink:0">+${fmt(t.amount)}</div>
          <button class="edit-btn" onclick="openEditTx('${t.id}','inc')">✏️</button>
          <button class="x-btn" onclick="removeInc('${t.id}')">×</button>
        </div>`;
      }
    });
  }

  el.innerHTML=html;
  if(catTots.length)drawDonut(catTots,catTotal);
}

function drawDonut(cats,total){
  const cv=document.getElementById('donut');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const cx=60,cy=60,R=46,r=28;
  ctx.clearRect(0,0,120,120);
  ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);
  ctx.arc(cx,cy,r,2*Math.PI,0,true);
  ctx.fillStyle=S.darkMode?'#29231D':'#F3EDE2';ctx.fill();
  let ang=-Math.PI/2;
  cats.forEach(c=>{
    const sweep=(c.v/total)*2*Math.PI;
    ctx.beginPath();
    ctx.arc(cx,cy,R,ang,ang+sweep);
    ctx.arc(cx,cy,r,ang+sweep,ang,true);
    ctx.closePath();ctx.fillStyle=c.color;ctx.fill();
    ang+=sweep;
  });
  ctx.fillStyle=S.darkMode?'#F2EDE4':'#1C1208';
  ctx.font='bold 10px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(fmt(total),cx,cy);
}

function openEditTx(id,type){
  if(type==='inc'){openAddInc(id);}
  else{openAddTx(id);}
}

window.pickCat=function(id,color){
  document.querySelectorAll('.cat-btn').forEach(b=>{b.classList.remove('on');b.style.color='';b.style.borderColor='';});
  const b=document.getElementById('cb-'+id);
  if(b){b.classList.add('on');b.style.color=color;b.style.borderColor=color;}
  window._selCat=id;
};
window.pickUser=function(id){
  ['u1','u2'].forEach(u=>{
    const b=document.getElementById('up-'+u);
    if(b){b.className='up-btn'+(u===id?' on-r':'');}
  });
  window._selUser=id;
};
window._selCat='alimentacao'; window._selUser='u1';

function saveTx(){
  const v=parseFloat(document.getElementById('tx-amt').value);
  const lbl=document.getElementById('tx-lbl').value.trim();
  if(!v||v<=0)return;
  if(window._editTxId){
    S.tx=S.tx.map(t=>t.id===window._editTxId?{...t,amount:v,category:window._selCat,label:lbl,user:window._selUser}:t);
  }else{
    S.tx.push({id:uid(),amount:v,category:window._selCat,label:lbl,user:window._selUser||'u1',date:new Date().toISOString()});
  }
  persist('tx',S.tx);closeSheet();render();toast(window._editTxId?'Despesa atualizada ✓':'Despesa salva ✓');
  window._editTxId=null;
}
function removeTx(id){S.tx=S.tx.filter(t=>t.id!==id);persist('tx',S.tx);render();}

async function compressImage(file){
  return new Promise(res=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1200;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    img.src=url;
  });
}

function extractJSON(txt){
  try{return JSON.parse(txt.trim());}catch{}
  const m=txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m)try{return JSON.parse(m[1].trim());}catch{}
  const o=txt.match(/\{[\s\S]*\}/);
  if(o)try{return JSON.parse(o[0]);}catch{}
  throw new Error('JSON não encontrado na resposta');
}

window.onScanFile=async function(e){
  const file=e.target.files[0];
  if(!file)return;
  if(!S.claudeKey){document.getElementById('scan-err').textContent='Configure a chave da API em Configurações.';return;}
  document.getElementById('scan-body').innerHTML=`<div style="text-align:center;padding:28px"><div style="font-size:36px;margin-bottom:12px">🔍</div><div style="font-size:14px;color:var(--txm);font-weight:500">Analisando a nota…</div></div>`;
  try{
    const b64=await compressImage(file);
    if(!b64)throw new Error('Não foi possível processar a imagem');
    if(!S.syncUrl||!S.syncPass)throw new Error('Configure o link do Apps Script nas Configurações.');
    const fd=new URLSearchParams();
    fd.append('p',S.syncPass);fd.append('a','scan');fd.append('img',b64);
    fd.append('mime','image/jpeg');fd.append('k',S.claudeKey);
    const resp=await fetch(S.syncUrl,{method:'POST',body:fd,redirect:'follow'});
    const rawText=await resp.text();
    let data;try{data=JSON.parse(rawText);}catch{throw new Error('Resposta inválida: '+rawText.slice(0,200));}
    if(!data.ok)throw new Error(data.error||'Erro no servidor');
    const result=extractJSON(data.result||'');
    showScanResult(result);
  }catch(err){
    document.getElementById('scan-body').innerHTML=
      `<div style="background:#FEE8E3;border-radius:10px;padding:14px;margin-bottom:14px;font-size:13px;color:var(--pri)">
        <div style="font-weight:600;margin-bottom:4px">Não foi possível ler a nota</div>
        <div style="font-size:11px;color:var(--txm)">${err.message}</div>
      </div>
      <button class="btn btn-pri btn-full" onclick="openScan()" style="margin-bottom:8px">Tentar novamente</button>
      <button class="btn btn-ghost btn-full" onclick="closeSheet()">Cancelar</button>`;
  }
};
function showScanResult(r){
  const rows=(r.items||[]).map(i=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--brds);font-size:13px"><span>${i.name} <span style="color:var(--txl)">×${i.quantity||1}</span></span><span style="font-weight:500">${fmtS(i.price)}</span></div>`).join('');
  document.getElementById('scan-body').innerHTML=`
    <div style="background:var(--grns);border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="font-size:13px;font-weight:600;color:var(--grn)">✓ Nota lida!</div>
      <div style="font-size:12px;color:var(--txm);margin-top:3px">${r.store} · Total: ${fmt(r.total||0)}</div>
    </div>
    <div style="margin-bottom:14px">${rows}</div>
    <button class="btn btn-grn btn-full" onclick="applyScan(${JSON.stringify(r).split('"').join("'")})">Salvar preços no histórico</button>`;
}

      <button class="x-btn" onclick="removeRec('${r.id}')">×</button>
    </div>`;}).join(''):'<div style="font-size:12px;color:var(--txl);margin-bottom:10px">Nenhum gasto fixo cadastrado.</div>'}</div>
    <button class="btn btn-ghost btn-full btn-sm" style="margin-bottom:4px" onclick="openAddRec()">+ Adicionar gasto fixo</button>

    <div class="set-section">Notificações</div>
    <div class="setting-row">
      <div>
        <div class="setting-label">Notificações de compromissos</div>
        <div class="setting-sub">${notifGranted?'Ativadas ✓':'Alertas ao abrir o app e no horário marcado'}</div>
      </div>
      ${notifGranted
        ?`<span style="font-size:11px;color:var(--grn);font-weight:600">ATIVO</span>`
        :`<button class="btn btn-sm btn-pri" onclick="requestNotifications().then(()=>openSettings())">Ativar</button>`
      }
    </div>

    <div class="set-section">Backup de dados</div>
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button class="btn btn-grn btn-sm" style="flex:1" onclick="exportBackup()">⬇ Exportar backup</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="document.getElementById('bkp-inp').click()">⬆ Restaurar backup</button>
    </div>
    <input type="file" id="bkp-inp" accept=".json" style="display:none" onchange="importBackup(this.files[0])">
    <div style="font-size:11px;color:var(--txl);margin-bottom:14px">Salve o arquivo JSON para nunca mais perder seus dados.</div>

    <div class="set-section">Sincronização (Google Sheets)</div>
    <div class="f-group"><label class="f-label">URL do Google Apps Script</label>
    <input class="f-inp" id="set-url" value="${S.syncUrl}" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="f-group"><label class="f-label">Senha de sincronização</label>
    <input class="f-inp" id="set-spass" type="password" value="${S.syncPass}"></div>

    <div class="set-section">Escaneamento de nota fiscal</div>
    <div class="f-group"><label class="f-label">Chave da API (Hugging Face)</label>
    <input class="f-inp" id="set-ckey" type="password" value="${S.claudeKey}" placeholder="hf_…"></div>
    <div style="font-size:11px;color:var(--txl);margin-bottom:16px">Gratuito em huggingface.co · Salvo só neste dispositivo</div>

    <button class="btn btn-pri btn-full" onclick="saveSettings()" style="margin-bottom:10px">Salvar configurações</button>
    ${S.syncUrl&&S.syncPass?`<button class="btn btn-sec btn-full" onclick="pullSync();closeSheet()">⏬ Sincronizar agora</button>`:''}
  `);
}

function saveSettings(){
  const u1=document.getElementById('set-u1').value.trim()||'Você';
  const u2=document.getElementById('set-u2').value.trim()||'Cônjuge';
  const pin=String(document.getElementById('set-pin').value).slice(0,4)||'1234';
  const url=document.getElementById('set-url').value.trim();
  const sp=document.getElementById('set-spass').value;
  const ck=document.getElementById('set-ckey').value.trim();
  S.unames=[u1,u2];S.pin=pin;S.syncUrl=url;S.syncPass=sp;S.claudeKey=ck;
  lsSet('un',[u1,u2]);lsSet('pin',pin);lsSet('syncUrl',url);lsSet('syncPass',sp);lsSet('claudeKey',ck);
  closeSheet();render();toast('Configurações salvas ✓');
}

// ─── RECURRING MANAGEMENT ───
function openAddRec(){
  window._selRecCat='moradia'; window._selRecUser='u1';
  sheet(`<div class="sheet-drag"></div><div class="sheet-title">Novo gasto fixo</div>
    <div class="f-group"><label class="f-label">Nome</label>
    <input class="f-inp" id="rec-lbl" placeholder="Aluguel, IPTU, Netflix…"></div>
    <div class="f-group"><label class="f-label">Valor (R$)</label>
    <input class="f-inp" id="rec-amt" type="number" placeholder="0,00"></div>
    <div class="f-group"><label class="f-label">Dia do mês (vencimento)</label>
    <input class="f-inp" id="rec-day" type="number" value="5" min="1" max="28"></div>
    <div class="f-group"><label class="f-label">Categoria</label>
    <div class="cat-grid" id="rcat-grid">${CATS.map(c=>`
      <button class="cat-btn${c.id==='moradia'?' on':''}" id="rcb-${c.id}"
        style="${c.id==='moradia'?'color:'+c.color+';border-color:'+c.color:''}"
        onclick="pickRecCat('${c.id}','${c.color}')">
        <div class="cat-ico">${c.icon}</div>
        <div class="cat-lbl">${c.label.split(' ')[0]}</div>
      </button>`).join('')}
    </div></div>
    <div class="f-group"><label class="f-label">Quem paga?</label>
    <div class="up-row">
      <button class="up-btn on-r" id="rup-u1" onclick="pickRecUser('u1')">${S.unames[0]}</button>
      <button class="up-btn" id="rup-u2" onclick="pickRecUser('u2')">${S.unames[1]}</button>
    </div></div>
    <button class="btn btn-pri btn-full" onclick="saveRec()">Salvar gasto fixo</button>
  `);
}
window.pickRecCat=function(id,color){
  document.querySelectorAll('#rcat-grid .cat-btn').forEach(b=>{b.classList.remove('on');b.style.color='';b.style.borderColor='';});
  const b=document.getElementById('rcb-'+id);
  if(b){b.classList.add('on');b.style.color=color;b.style.borderColor=color;}
  window._selRecCat=id;
};
window.pickRecUser=function(id){
  ['u1','u2'].forEach(u=>{const b=document.getElementById('rup-'+u);if(b)b.className='up-btn'+(u===id?' on-r':'');});
  window._selRecUser=id;
};
function saveRec(){
  const lbl=document.getElementById('rec-lbl').value.trim();
  const amt=parseFloat(document.getElementById('rec-amt').value);
  const day=parseInt(document.getElementById('rec-day').value)||5;
  if(!lbl||!amt||amt<=0)return;
  const newRec={id:uid(),label:lbl,amount:amt,category:window._selRecCat||'moradia',user:window._selRecUser||'u1',day};
  S.rec.push(newRec);
  persist('rec',S.rec);
  // Apply immediately for this month
  const key=`${NOW.getFullYear()}-${NOW.getMonth()}`;
  const applied=lsGet('recApplied',{});
  const done=applied[key]||[];
  if(!done.includes(newRec.id)){
    const d=new Date(NOW.getFullYear(),NOW.getMonth(),Math.min(day,28));
    S.tx.push({id:uid(),amount:amt,category:newRec.category,label:lbl,user:newRec.user,date:d.toISOString(),isRec:true,recId:newRec.id});
    done.push(newRec.id);applied[key]=done;
    lsSet('recApplied',applied);persist('tx',S.tx);
  }
  closeSheet();openSettings();toast('Gasto fixo salvo ✓');
}
function removeRec(id){
  S.rec=S.rec.filter(r=>r.id!==id);
  persist('rec',S.rec);
  closeSheet();openSettings();toast('Gasto fixo removido');
}

// ═══════════════════════════════════════════════════
// SHEET MODAL
// ═══════════════════════════════════════════════════
function sheet(html){
  const s=document.getElementById('sheet');
  const o=document.getElementById('overlay');
  s.innerHTML=html;
  s.style.display='block';o.style.display='block';
  requestAnimationFrame(()=>{s.style.transform='translateY(0)';});
}
function closeSheet(){
  document.getElementById('sheet').style.display='none';
  document.getElementById('overlay').style.display='none';
}
